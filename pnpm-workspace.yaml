packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
overrides:
  "@next/env": npm:@varlock/nextjs-integration@1.2.2
  # react-jsx-parser declares an optional peer on the React 18 types. A second
  # copy of ReactNode in the graph makes every node type mutually incompatible,
  # which broke components that have nothing to do with it.
  "react-jsx-parser>@types/react": ^19.2.18
  "react-jsx-parser>@types/react-dom": ^19.2.7
catalog:
  zod: ^4.5.4
  "@types/node": ^26.4.1
  varlock: 1.18.0
  lucide-react: ^1.41.0
  next-themes: ^0.4.6
  sonner: ^2.0.8
  "@trpc/server": ^11.18.0
  "@trpc/client": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@tanstack/react-query": ^5.102.8
  better-auth: 1.7.3
  "@tanstack/react-form": ^1.33.5
  ai: ^7.0.93
  "@ai-sdk/react": ^4.0.96
  "@tailwindcss/postcss": ^4.3.3
  "@types/react-dom": ^19.2.7
  tailwindcss: ^4.3.3
  "@better-auth/expo": 1.7.3
  drizzle-orm: ^0.45.2
  "@types/pg": ^8.23.1
  "@opensearch-project/opensearch": ^3.5.1
  ioredis: ^5.9.0
  "@react-email/render": ^2.1.0
  "retransmit.dev": ^0.7.0
  react: ^19.2.8
  "@types/react": ^19.2.18
  "react-email": ^6.9.5
  "@react-email/ui": ^6.9.5
  react-dom: ^19.2.8
