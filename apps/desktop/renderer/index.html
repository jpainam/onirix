<!doctype html>
<!-- `onirix-app` selects the app type scale in globals.css (a 15px root, so
     text-sm lands on 13px). The preload adds its own classes beside it. -->
<html lang="en" class="onirix-app">
  <head>
    <meta charset="utf-8" />
    <!-- The shell sends the same policy as a header (LOCAL_CSP in main.ts).
         No network at all from this page: model calls are made by the main
         process, and 'self' is the shell's own scheme, answered from the disk. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onirix</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
