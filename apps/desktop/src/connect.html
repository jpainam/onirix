<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Connect to Onirix</title>
    <style>
      /* The same tokens as packages/ui globals.css, so the first screen and the
         product it opens are visibly one app. */
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --card: #fafafa;
        --foreground: #000000d9;
        --ink-03: #0000008c;
        --border: #e6e6e6;
        --primary: #1c1c1c;
        --primary-foreground: #fffffff2;
        --ring: #286df8;
        --danger: #dc2626;
        --danger-subtle: #fceae7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #000000;
          --card: #19191e;
          --foreground: #ffffffd9;
          --ink-03: #ffffff99;
          --border: #333333;
          --primary: #e9e9e9;
          --primary-foreground: #000000;
          --ring: #508afb;
          --danger: #f23a36;
          --danger-subtle: #330b09;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        display: flex;
        flex-direction: column;
      }
      .drag {
        height: 40px;
        flex: none;
        -webkit-app-region: drag;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        padding: 0 48px 56px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .brand svg {
        width: 24px;
        height: 24px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        color: var(--ink-03);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      label {
        font-size: 13px;
        font-weight: 500;
      }
      input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: inherit;
        font: inherit;
        user-select: text;
        outline: none;
      }
      input:focus-visible {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 25%, transparent);
      }
      button {
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 500;
        cursor: default;
      }
      button:disabled {
        opacity: 0.55;
      }
      .error {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--danger-subtle);
        color: var(--danger);
        font-size: 13px;
        user-select: text;
      }
      .error:empty {
        display: none;
      }
      .hint {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <main>
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M8.2 1.6h7.6L22.4 8.2v7.6L15.8 22.4H8.2L1.6 15.8V8.2L8.2 1.6Zm3.8 4.1L9.1 12l2.9 6.3 2.9-6.3-2.9-6.3Z"
            fill="currentColor"
            fill-rule="evenodd"
            clip-rule="evenodd"
          />
        </svg>
        onirix
      </div>

      <div>
        <h1>Connect to your workspace</h1>
        <p>Enter the address of your Onirix server.</p>
      </div>

      <form id="form">
        <label for="server">Server address</label>
        <input id="server" name="server" autocomplete="off" spellcheck="false" required />
        <div class="error" id="error" role="alert"></div>
        <button id="submit" type="submit">Connect</button>
        <p class="hint">
          Self-hosting on this computer? The default is http://localhost:3001.
        </p>
      </form>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      const form = document.getElementById("form");
      const input = document.getElementById("server");
      const error = document.getElementById("error");
      const submit = document.getElementById("submit");

      input.value = params.get("server") ?? "";
      error.textContent = params.get("message") ?? "";
      input.focus();
      input.select();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        submit.disabled = true;
        submit.textContent = "Connecting";
        try {
          await window.onirixConnect.submit(input.value);
        } catch (failure) {
          // Electron prefixes the message with the channel it failed on.
          error.textContent = String(failure.message ?? failure).replace(
            /^Error invoking remote method '[^']+': (Error: )?/,
            "",
          );
          submit.disabled = false;
          submit.textContent = "Connect";
        }
      });
    </script>
  </body>
</html>
